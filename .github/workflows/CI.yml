name: CI
on:
  push:
    tags:
      - "*"
    branches:
      - master
      - renovate/**
  pull_request:
env:
  ProjectName: ${{ github.event.repository.name }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NET_VERSION: 11.0.x

permissions:
  contents: read

jobs:
  check_format:
    name: Check format
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}
      - run: dotnet format -v diag --verify-no-changes

  test:
    name: Run tests
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          echo "REQUIRE_FFMPEG=1" >> "$GITHUB_ENV"

      - run: dotnet test -c Release

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: artifacts/test/**/*-report.html

  build:
    name: Build (${{ matrix.target.rid }})
    needs: [test, check_format]
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-26.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.NET_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libfontconfig-dev

      - name: Build
        working-directory: src/${{ env.ProjectName }}.Desktop
        run: dotnet publish -r ${{ matrix.target.rid }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/${{ env.ProjectName }}.Desktop/release_${{ matrix.target.rid }}/*" -DestinationPath "${{ env.ProjectName }}-${{ matrix.target.rid }}.zip"

      # upload-artifact 不保留文件权限，先打成 tar 保住可执行位
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "${{ env.ProjectName }}-${{ matrix.target.rid }}.tar.gz" -C "artifacts/publish/${{ env.ProjectName }}.Desktop/release_${{ matrix.target.rid }}" .

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ProjectName }}-${{ matrix.target.rid }}
          path: ${{ env.ProjectName }}-${{ matrix.target.rid }}.*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8

      - name: Rename
        run: |
          mkdir -p builtfiles
          for archive in "${{ env.ProjectName }}"-*/*; do
            file="$(basename "$archive")"
            cp "$archive" "builtfiles/${{ env.ProjectName }}-${{ github.ref_name }}-${file#${{ env.ProjectName }}-}"
          done

      - name: Create a new GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: builtfiles/*
          immutableCreate: true
          updateOnlyUnreleased: true
